name: Generate AI Daily Briefing

on:
  schedule:
    # 09:17 Asia/Shanghai (UTC+8). Avoid running exactly on the hour.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date YYYY-MM-DD; empty means previous day in Asia/Shanghai"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ai-daily-briefing
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Generate and send
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          REPORT_TIMEZONE: Asia/Shanghai
          REPORT_DATE: ${{ inputs.report_date }}
        run: uv run python -m app

      - name: Commit generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "chore: add AI daily report"
          git push
