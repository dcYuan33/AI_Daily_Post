name: Generate AI Daily Briefing
run-name: "${{ inputs.site_only && 'Deploy Pages · existing reports only' || 'Generate AI daily report' }}"

on:
  schedule:
    # 09:17 Asia/Shanghai (UTC+8). Avoid running exactly on the hour.
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date YYYY-MM-DD; empty means previous day in Asia/Shanghai"
        required: false
        type: string
      site_only:
        description: "Only rebuild and deploy GitHub Pages; do not collect news or send Telegram"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-daily-briefing
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate report and site
        if: ${{ inputs.site_only != true }}
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_TIMEZONE: Asia/Shanghai
          REPORT_DATE: ${{ inputs.report_date }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: uv run --locked python -m app

      - name: Rebuild site only
        if: ${{ inputs.site_only == true }}
        run: uv run --locked python -m app.site

      - name: Commit generated report and site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports site
          git diff --cached --quiet || git commit -m "chore: add AI daily report"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
